<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PYGRESS - Competency Score Analyzer</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 40px 20px;
      background: linear-gradient(to right, #eff6ff, #f9fafb);
    }

    .container {
      max-width: 900px;
      margin: auto;
      background-color: #ffffff;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.08);
      transition: transform 0.3s ease;
    }

    .logo {
      display: block;
      margin: 0 auto;
      max-width: 100px;
      height: auto;
    }

    .container:hover {
      transform: translateY(-2px);
    }

    h1 {
      text-align: center;
      font-size: 32px;
      color: #000000;
      margin: 0;
      margin-bottom: 20px;
    }

    h2 {
      text-align: center;
      font-size: 18px;
      font-weight: 400;
      color: #475569;
      margin-top: 0;
      margin-bottom: 30px;
    }

    label {
      font-weight: 600;
      color: #374151;
      display: block;
      margin-top: 24px;
      margin-bottom: 8px;
    }

    .input-group {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    input[type="text"],
    input[type="file"] {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      background-color: #f1f5f9;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus,
    input[type="file"]:focus {
      border-color: #60a5fa;
      outline: none;
    }

    button {
      background-color: #2563eb;
      color: white;
      padding: 14px 20px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      transition: background-color 0.3s ease;
      white-space: nowrap;
    }

    button:hover {
      background-color: #1d4ed8;
    }

    .divider {
      text-align: center;
      margin: 30px 0;
      color: #9ca3af;
      position: relative;
      font-size: 14px;
    }

    .divider::before,
    .divider::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 40%;
      height: 1px;
      background: #e2e8f0;
    }

    .divider::before {
      left: 0;
    }

    .divider::after {
      right: 0;
    }

    h3 {
      margin-top: 30px;
      font-size: 20px;
      font-weight: 600;
      color: #1f2937;
    }

    iframe {
      width: 100%;
      height: 600px;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="logopygress.jpg" alt="PYGRESS Logo" class="logo">
    <h1>PYGRESS</h1>
    <h2>Analyzing coding competency of Python contributors in open-source projects</h2>

    <label for="repoInput">Enter your GitHub repository URL:</label>
    <div class="input-group">
      <input type="text" id="repoInput" placeholder="https://github.com/username/project" />
      <button onclick="openReport()">Generate</button>
    </div>

    <div class="divider">or</div>

    <label for="fileInput">Upload local JSON files:</label>
    <input type="file" id="fileInput" multiple />

    <label style="margin-top: 24px">Visualization Here!</label>
    <iframe id="reportFrame" src=""></iframe>

  </div>

  <script>
    function openReport() {
      const reportPath = "Visualization_Alive_Result/A_AcraNetwork_Visualization.html";
      document.getElementById("reportFrame").src = reportPath;
    }
  </script>
</body>
</html>
